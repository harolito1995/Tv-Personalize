plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harolhome.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.harolhome.tv'
        minSdk 26
        targetSdk 29
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    lint {
        // The launcher is sideloaded over ADB, never published to Google Play, so Play's minimum targetSdk
        // does not apply; without this, lintVitalRelease fails assembleRelease.
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'

    // Unit tests only (never shipped in the APK): the catalogue parser runs on plain JVM org.json.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
